services:
  - type: web
    name: inclusivematch-ai
    runtime: python
    buildCommand: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 100 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: SOCKETIO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: WEBRTC_STUN_URLS
        value: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
      - key: WEBRTC_TURN_URL
        sync: false
      - key: WEBRTC_TURN_TLS_URL
        sync: false
      - key: WEBRTC_TURN_USERNAME
        sync: false
      - key: WEBRTC_TURN_CREDENTIAL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_SMTP_HOST
        value: smtp-relay.brevo.com
      - key: BREVO_SMTP_PORT
        value: "587"
      - key: BREVO_SMTP_LOGIN
        sync: false
      - key: BREVO_SMTP_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: InclusiveMatch AI
      - key: APP_BASE_URL
        value: https://incusivematch-ai.onrender.com

