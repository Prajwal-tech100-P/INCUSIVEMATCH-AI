services:
  - type: web
    name: inclusivematch-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet --workers 1 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: SOCKETIO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: WEBRTC_STUN_URLS
        value: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
      - key: WEBRTC_TURN_URL
        sync: false
      - key: WEBRTC_TURN_TLS_URL
        sync: false
      - key: WEBRTC_TURN_USERNAME
        sync: false
      - key: WEBRTC_TURN_CREDENTIAL
        sync: false
