{% extends "base.html" %}
{% block title %}Settings - Admin{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div><h2 class="fw-bold mb-1">⚙️ Settings</h2><p class="text-muted mb-0">Basic platform administration settings.</p></div>
        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-light rounded-pill">Dashboard</a>
    </div>
    <div class="card border-0 shadow-sm rounded-4 p-4" style="max-width:700px;">
        <form method="post">
            <div class="form-check form-switch mb-4">
                <input class="form-check-input" type="checkbox" role="switch" id="maintenance_mode" name="maintenance_mode" {% if settings.get('maintenance_mode') %}checked{% endif %}>
                <label class="form-check-label fw-semibold" for="maintenance_mode">Maintenance mode</label>
                <div class="form-text">Stores the platform maintenance flag for future deployment controls. It does not automatically block users.</div>
            </div>
            <button class="btn btn-primary rounded-pill px-4" type="submit"><i class="bi bi-save me-1"></i>Save Settings</button>
        </form>
    </div>
</div>
{% endblock %}
