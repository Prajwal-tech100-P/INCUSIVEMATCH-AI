{% extends "base.html" %}

{% block title %}Sign Up - Inclusive Match AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 glass-panel">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-plus-fill fs-1 text-primary"></i>
                        <h2 class="fw-bold mt-2">Create an Account</h2>
                        <p class="text-muted">Join the community today.</p>
                    </div>

                    <form action="/register" method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control form-control-lg bg-light" id="name" name="name"
                                required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email address</label>
                            <input type="email" class="form-control form-control-lg bg-light" id="email" name="email"
                                required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control form-control-lg bg-light" id="password"
                                    name="password" required>
                            </div>
                            <div class="col-md-6">
                                <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
                                <input type="password" class="form-control form-control-lg bg-light"
                                    id="confirm_password" name="confirm_password" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="comm_pref" class="form-label fw-semibold">Primary Communication
                                Preference</label>
                            <select class="form-select form-select-lg bg-light" id="comm_pref" name="comm_pref"
                                required>
                                <option value="" selected disabled>Select an option...</option>
                                <option value="sign">Sign Language</option>
                                <option value="text">Text Messaging</option>
                                <option value="speech">Spoken Word (Speech-to-Text)</option>
                            </select>
                        </div>

                        <div class="d-grid gap-2 mt-5">
                            <button type="submit"
                                class="btn btn-primary btn-lg fw-bold rounded-pill hover-lift shadow-sm">Sign
                                Up</button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-0 text-muted">Already have an account? <a href="/login"
                                class="text-decoration-none fw-semibold">Log In</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
