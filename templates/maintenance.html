<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance - InclusiveMatch AI</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: #2b2d42;
        }

        .maintenance-card {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .icon-container {
            font-size: 5rem;
            color: #4f46e5;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        h1 {
            font-weight: 700;
            margin-bottom: 1rem;
            color: #1e293b;
        }

        p {
            font-size: 1.1rem;
            color: #64748b;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .admin-login {
            font-size: 0.9rem;
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .admin-login:hover {
            color: #4f46e5;
        }
    </style>
</head>

<body>
    <div class="maintenance-card">
        <div class="icon-container">
            <i class="bi bi-tools"></i>
        </div>
        <h1>Maintenance in Progress</h1>
        <p>Sorry, InclusiveMatch AI is currently under maintenance. We are making things better for you. Please try
            again later.</p>

        <a href="{{ url_for('auth.login') }}" class="admin-login">Administrator Login</a>
    </div>
</body>

</html>
